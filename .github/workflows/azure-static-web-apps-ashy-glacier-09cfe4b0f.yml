name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Clean and install dependencies
        working-directory: ./frontend
        run: |
          # Workaround for npm optional dependency bug with Rollup
          # See: https://github.com/npm/cli/issues/4828
          
          # Clean any cached/corrupted modules
          rm -rf node_modules
          
          # Try clean install first, fallback to regular install
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          
          # Explicitly ensure rollup platform package is installed
          npm install @rollup/rollup-linux-x64-gnu --save-optional --legacy-peer-deps
          
          # Verify rollup is properly installed
          npm list @rollup/rollup-linux-x64-gnu || echo "Warning: Rollup platform package not found, but continuing..."
          
      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_PROJECT_NAME: ${{ vars.VITE_PROJECT_NAME || 'MongoDB Microsite' }}
          VITE_VERSION: ${{ vars.VITE_VERSION || '0.1.0' }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_API_V1_STR: ${{ vars.VITE_API_V1_STR || '/api/v1' }}
          VITE_AZURE_BLOB_BASE_URL: ${{ vars.VITE_AZURE_BLOB_BASE_URL || 'https://mmsuploads.blob.core.windows.net/casestudies' }}
        run: npm run build

      - name: Verify build output
        working-directory: ./frontend
        run: |
          echo "✓ Checking build output..."
          ls -lah build/
          
          # Verify index.html exists
          if [ -f "build/index.html" ]; then
            echo "✓ index.html found"
          else
            echo "❌ index.html NOT found!"
            exit 1
          fi
          
          # Verify staticwebapp.config.json exists in frontend root (Azure will read from here)
          if [ -f "staticwebapp.config.json" ]; then
            echo "✓ staticwebapp.config.json found in frontend root (Azure will use this)"
          else
            echo "❌ staticwebapp.config.json NOT found in frontend root!"
            exit 1
          fi
          
          # Show JS files
          echo "✓ JavaScript modules in assets:"
          ls -lh build/assets/*.js 2>/dev/null | head -5 || echo "No JS files found"
          
          echo "✓ Build verification complete!"

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_GLACIER_09CFE4B0F }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "./frontend"
          api_location: ""
          output_location: "build"
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
