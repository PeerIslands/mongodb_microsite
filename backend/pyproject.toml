[tool.poetry]
name = "mongodb-microsite"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.4.0"
python-dotenv = "^1.0.0"
python-multipart = "^0.0.6"
bcrypt = "^4.1.0"
email-validator = "^2.1.0"
PyJWT = "^2.8.0"
motor = "^3.7.1"
azure-storage-blob = "^12.28.0"
azure-communication-email = "^1.0.0"
httpx = "^0.26.0"
# TOTP/MFA Dependencies
pyotp = "^2.9.0"
qrcode = {extras = ["pil"], version = "^7.4.2"}
cryptography = "^42.0.0"
# AI Extraction Dependencies
PyPDF2 = "^3.0.1"
python-pptx = "^0.6.23"
python-docx = "^1.1.0"
Pillow = "^10.2.0"
pytesseract = "^0.3.10"
openai = "^1.12.0"
# Markdown to HTML conversion
markdown = "^3.5.0"
# Excel generation
openpyxl = "^3.1.2"
PyYAML = "^6.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
black = "^24.1.0"
isort = "^5.13.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"

